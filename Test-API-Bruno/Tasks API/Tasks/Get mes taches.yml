info:
  name: "Get mes taches "
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/tasks"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("le statut doit être 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("la réponse est un tableau", function() {
          expect(res.getBody()).to.be.an('array');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
