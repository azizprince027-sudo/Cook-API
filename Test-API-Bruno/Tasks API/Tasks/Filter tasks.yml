info:
  name: Filter tasks
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/tasks?completed=false&priority=high"
  params:
    - name: completed
      value: "false"
      type: query
    - name: priority
      value: high
      type: query
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("le statut doit être 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
