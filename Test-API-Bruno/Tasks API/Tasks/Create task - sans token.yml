  url: "{{baseUrl}}/tasks"
  body:
    type: json
    data: |-
      {
        "title": "Apprendre NestJS",
        "description": "Terminer le projet",
        "priority": "high"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("le statut doit être 401", function() {
          expect(res.getStatus()).to.equal(401);
        });

