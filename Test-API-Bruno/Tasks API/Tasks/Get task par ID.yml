info:
  name: Get task par ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/tasks/{{taskId}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("le statut doit être 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("l'id correspond", function() {
          expect(res.getBody().id).to.equal(parseInt(bru.getEnvVar("taskId")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
