info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "alice@example.com",
        "password": "12345678"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setEnvVar("token", res.getBody().access_token);

        //  bru.setEnvVar("token", ...) → sauvegarde la valeur du token dans une variable d'environnement appelée token, qu'on pourra ensuite réutiliser partout avec {{token}} — exactement comme {{baseUrl}}.

        // on execute du codes  apres avoirs ressus la reponses pour faire des action cmme sauvegarder valeurs
    - type: tests
      code: |-
        test("le statut doit être 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("la réponse contient un access_token", function() {
          expect(res.getBody()).to.have.property('access_token');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
